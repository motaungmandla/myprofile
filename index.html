<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Release Center</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-disabled: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Header Layout */
        header {
            width: 100%;
            max-width: 1000px;
            padding: 40px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-container {
            width: 90px;
            height: 90px;
            margin-bottom: 16px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: var(--bg-color);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Content Container */
        main {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            flex-grow: 1;
        }

        .section-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin: 30px 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: var(--card-border);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        /* Glassmorphism Card Design */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .badge-apk {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-exe {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            word-break: break-all;
        }

        /* Buttons */
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-apk {
            background: var(--accent-green);
            color: #042f2e;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .btn-apk:hover {
            background: #34d399;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-disabled {
            background: var(--accent-disabled);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Footer Layout */
        footer {
            width: 100%;
            border-top: 1px solid var(--card-border);
            padding: 30px 20px;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.8);
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-logo {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .footer-text {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Mobile Screens Optimization */
        @media (max-width: 600px) {
            header {
                padding-top: 24px;
            }

            .logo-container {
                width: 75px;
                height: 75px;
            }

            h1 {
                font-size: 1.6rem;
            }

            main {
                padding: 12px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="mandla.png" alt="Logo">
        </div>
        <h1>App Release Portal</h1>
        <p class="subtitle">Direct access to official Android and Desktop builds</p>
    </header>

    <main>
        
        <!-- Mobile Section -->
        <div class="section-title">Android Builds</div>
        <div class="grid">
            
            <div class="card">
                <div class="card-top">
                    <span class="badge badge-apk">APK</span>
                </div>
                <h3>minerals.apk</h3>
                <a href="minerals.apk" class="btn btn-apk" download>Download Package</a>
            </div>

            <div class="card">
                <div class="card-top">
                    <span class="badge badge-apk">APK</span>
                </div>
                <h3>mmandla.apk</h3>
                <a href="mmandla.apk" class="btn btn-apk" download>Download Package</a>
            </div>

            <div class="card">
                <div class="card-top">
                    <span class="badge badge-apk">APK</span>
                </div>
                <h3>Motaung.apk</h3>
                <a href="Motaung.apk" class="btn btn-apk" download>Download Package</a>
            </div>

        </div>

        <!-- Desktop Section -->
        <div class="section-title">Windows Builds</div>
        <div class="grid">
            
            <div class="card">
                <div class="card-top">
                    <span class="badge badge-exe">EXE</span>
                </div>
                <h3>Desktop Application</h3>
                <button class="btn btn-disabled" disabled>Coming Soon</button>
            </div>

        </div>

    </main>

    <footer>
        <div class="footer-brand">
            <img src="mandla.png" alt="Logo" class="footer-logo">
            <span class="footer-text">&copy; All rights reserved.</span>
        </div>
    </footer>

</body>
</html>
