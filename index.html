<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Download Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2rem;
            color: #1a252f;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #666;
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .section-title {
            grid-column: 1 / -1;
            font-size: 1.25rem;
            margin-top: 10px;
            color: #2c3e50;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .badge-apk {
            background-color: #e6f4ea;
            color: #137333;
        }

        .badge-exe {
            background-color: #e8f0fe;
            color: #1a73e8;
        }

        .card h2 {
            font-size: 1.2rem;
            word-break: break-word;
        }

        .btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
        }

        .btn-download {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-download:hover {
            background-color: #1d4ed8;
        }

        .btn-disabled {
            background-color: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .card {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Download Center</h1>
        <p class="subtitle">Select a package to download for Android or Desktop</p>
    </header>

    <main class="container">
        
        <!-- Android Section -->
        <h2 class="section-title">Android Applications (.apk)</h2>

        <div class="card">
            <div class="card-header">
                <span class="badge badge-apk">APK</span>
                <h2>minerals.apk</h2>
            </div>
            <a href="minerals.apk" class="btn btn-download" download>Download APK</a>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="badge badge-apk">APK</span>
                <h2>mmandla.apk</h2>
            </div>
            <a href="mmandla.apk" class="btn btn-download" download>Download APK</a>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="badge badge-apk">APK</span>
                <h2>Motaung.apk</h2>
            </div>
            <a href="Motaung.apk" class="btn btn-download" download>Download APK</a>
        </div>

        <!-- Desktop Section -->
        <h2 class="section-title">Windows Applications (.exe)</h2>

        <div class="card">
            <div class="card-header">
                <span class="badge badge-exe">EXE</span>
                <h2>Desktop App</h2>
            </div>
            <button class="btn btn-disabled" disabled>Coming Soon</button>
        </div>

    </main>

</body>
</html>
